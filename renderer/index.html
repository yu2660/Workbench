<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Workbench</title>
  <link rel="stylesheet" href="../node_modules/pdfjs-dist/web/pdf_viewer.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#" id="brand"><span class="brand-mark">w<span>·</span></span><span>Workbench<small>你的课程，都在这里。</small></span></a>
    <div class="nav-caption">学习空间</div>
    <button class="nav-item active" id="nav-home"><span>▦</span> 课程书架</button>
    <button class="nav-item" id="nav-recent"><span>◷</span> 最近阅读</button>
    <div class="nav-caption course-caption">我的课程 <button id="sidebar-add" title="新建课程">＋</button></div>
    <nav id="course-nav"></nav>
    <div class="sidebar-bottom"><div class="local-pill"><i></i> 本地资料库 · 离线</div><button id="settings" class="root-button" title="选择资料库">⚙ 资料库设置</button><small id="root-label">尚未选择资料库</small><small class="version">Workbench / 0.1.1</small></div>
  </aside>
  <main>
    <header class="topbar"><div id="breadcrumb">学习空间 <span>/</span> 课程书架</div><div class="search-wrap"><span>⌕</span><input id="search" placeholder="搜索课程资料…" aria-label="搜索文件名"><select id="search-scope" aria-label="搜索范围"><option value="all">全部课程</option><option value="course">当前课程</option></select><kbd>Ctrl K</kbd></div></header>
    <div id="workspace"></div>
  </main>
  <div id="toast" role="status" hidden></div>
  <dialog id="modal"><form id="modal-form"><div id="modal-body"></div><div class="modal-actions"><button type="button" id="modal-cancel">取消</button><button class="primary" type="submit">确定</button></div></form></dialog>
  <div id="busy" hidden><div class="spinner"></div><span id="busy-text">正在处理…</span></div>
  <script type="module" src="app.js"></script>
</body>
</html>
